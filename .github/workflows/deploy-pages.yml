name: Deploy BANA Admin Console to GitHub Pages

# Push this folder to the main branch of the SEPARATE admin repository.
# Then: Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/configure-pages@v5

      - name: Work out the site base path
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO" == *.github.io ]]; then echo "path=/" >> "$GITHUB_OUTPUT"; else echo "path=/${REPO}/" >> "$GITHUB_OUTPUT"; fi

      - name: Install dependencies
        run: |
          npm ci || npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_FIREBASE_PLAN_MODE: ${{ vars.VITE_FIREBASE_PLAN_MODE || 'spark' }}
          VITE_ENABLE_CLOUD_FUNCTIONS: ${{ vars.VITE_ENABLE_CLOUD_FUNCTIONS || 'false' }}
          VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
          VITE_MEDIA_BROKER_URL: ${{ vars.VITE_MEDIA_BROKER_URL }}
          VITE_USER_SITE_URL: ${{ vars.VITE_USER_SITE_URL }}
          VITE_ADMIN_IDLE_MINUTES: ${{ vars.VITE_ADMIN_IDLE_MINUTES || '30' }}

      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
